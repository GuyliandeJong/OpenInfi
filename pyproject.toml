[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infi75"
version = "0.1.0"
description = "Open-source configurator for the Infiverse INFI75 keyboard: key remapping, RGB lighting and screen"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "hidapi>=0.14",
    "Pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
infi75 = "infi75.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
infi75 = ["profiles/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
