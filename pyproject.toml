[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infi75"
version = "0.1.0"
description = "Open-source Linux configurator for the Infiverse INFI75 keyboard: lighting, key colours, remapping, macros and screen"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "hidapi>=0.14",
    "Pillow>=10",
    "pyusb>=1.2",
]

[project.urls]
Homepage = "https://github.com/GuyliandeJong/Infi75"
Issues = "https://github.com/GuyliandeJong/Infi75/issues"
Funding = "https://ko-fi.com/guyliandejong"

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest>=7"]

[project.scripts]
infi75 = "infi75.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
infi75 = ["profiles/*.json", "data/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
